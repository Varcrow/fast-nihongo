<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e"/>
      <stop offset="100%" style="stop-color:#181825"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cba6f7"/>
      <stop offset="100%" style="stop-color:#89b4fa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bgGrad)"/>

  <!-- Subtle border -->
  <rect width="512" height="512" rx="96" ry="96" fill="none" stroke="#313244" stroke-width="4"/>

  <!-- Speed lines (suggests fast) -->
  <line x1="60" y1="180" x2="130" y2="180" stroke="#313244" stroke-width="6" stroke-linecap="round"/>
  <line x1="40" y1="210" x2="120" y2="210" stroke="#313244" stroke-width="4" stroke-linecap="round"/>
  <line x1="55" y1="240" x2="115" y2="240" stroke="#313244" stroke-width="3" stroke-linecap="round"/>

  <!-- 日 kanji (sun/day) - top portion, stylized -->
  <!-- Outer rectangle of 日 -->
  <rect x="168" y="100" width="176" height="140" rx="8" fill="none" stroke="url(#strokeGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Middle bar of 日 -->
  <line x1="168" y1="170" x2="344" y2="170" stroke="url(#strokeGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>

  <!-- 本 kanji (origin/book) - bottom portion, stylized -->
  <!-- Vertical stroke -->
  <line x1="256" y1="278" x2="256" y2="400" stroke="url(#strokeGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Horizontal stroke -->
  <line x1="160" y1="320" x2="352" y2="320" stroke="url(#strokeGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Left diagonal -->
  <line x1="256" y1="355" x2="190" y2="410" stroke="url(#strokeGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Right diagonal -->
  <line x1="256" y1="355" x2="322" y2="410" stroke="url(#strokeGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Small speed dot accent -->
  <circle cx="390" cy="195" r="10" fill="#cba6f7" opacity="0.7" filter="url(#glow)"/>
  <circle cx="420" cy="195" r="7" fill="#89b4fa" opacity="0.5" filter="url(#glow)"/>
  <circle cx="445" cy="195" r="4" fill="#cba6f7" opacity="0.3"/>
</svg>
