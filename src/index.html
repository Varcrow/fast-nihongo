<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Fast Nihongo</title>
    <link rel="stylesheet" href="css/index.css" />
</head>

<body>
    <div id="overlay"></div>
    <div id="menu-container" class="menu-panel"></div>

    <div class="sidebar float">
        <div class="sidebar-controls">
            <input class="text-bar" id="wordlist-name" type="text" placeholder="New wordlist">
            <div class="sidebar-buttons">
                <button id="save-button" type="button">Save</button>
                <button id="delete-button" type="button">Delete</button>
            </div>
            <button id="new-wordlist-button" type="button">New Wordlist</button>
        </div>
        <div class="sidebar-divider"></div>
        <div id="sidebar-wordlists"></div>
        <div class="sidebar-divider"></div>
        <button id="settings-button" type="button">⚙ Settings</button>
    </div>
    <div id="notification-container"></div>
    <div class="search-controls float">
        <input class="text-bar" id="search-input" type="text">
    </div>
    <main>
        <div class="word-container" id="search-result-container"></div>
        <div class="word-container" id="wordlist-words-container"></div>
    </main>

    <script src="js/notify.js"></script>
    <script src="js/wordlist.js"></script>
    <script src="js/menus.js"></script>
    <script src="js/settings.js"></script>
    <script src="renderer.js"></script>
</body>

</html>
