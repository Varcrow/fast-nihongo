<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Fast Nihongo</title>
    <link rel="stylesheet" href="css/dev.css" />
</head>

<body>
    <!--FIXED ITEMS-->
    <div id="overlay"></div>
    <div id="notification-container"></div>
    <div id="menu-container"></div>

    <!--SEARCH BAR-->
    <input class="search-bar box" type="text" style="grid-area: box-1">

    <!--SIDE BAR-->
    <nav class="box" style="grid-area: box-2">
        <input type="text" placeholder="New wordlist">
        <div class="buttons">
            <button type="button">Save</button>
            <button type="button">Delete</button>
        </div>
        <button type="button">New Wordlist</button>
        <div class="divider"></div>
        <div id="wordlists-container"></div>
        <div class="divider"></div>
        <button type="button">Settings</button>
    </nav>

    <!--CONTENT DISPLAY-->
    <main class="box" style="grid-area: box-3">
        <div class="word-container" id="search-result-container"></div>
        <div class="word-container" id="wordlist-words-container"></div>
    </main>

    <script src="js/notify.js"></script>
    <script src="js/wordlist.js"></script>
    <script src="js/menus.js"></script>
    <script src="js/settings.js"></script>
    <script src="renderer.js"></script>
</body>

</html>
