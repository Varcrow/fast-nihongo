<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Wordlists</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
</head>

<body>
    <!--FIXED ITEMS-->
    <div id="notification-container"></div>

    <!--SEARCH BAR-->
    <input id="search-bar" class="neu-input" type="text" style="grid-area: box-1" placeholder="Search">

    <!--SIDE BAR-->
    <nav class="neu-card" style="grid-area: box-2">
        <input id="wordlist-name" class="neu-input" type="text" placeholder="New wordlist">
        <div class="dual-buttons">
            <button id="save" class="neu-btn save" type="button">Save</button>
            <button id="delete" class="neu-btn delete" type="button">Delete</button>
        </div>

        <!-- DELETE CONFIRMATION MENU -->
        <div id="delete-menu" class="neu-card menu">
            <h2>Delete current wordlist?</h2>
            <div class="dual-buttons">
                <button id="delete-no" class="neu-btn no" type="button">No</button>
                <button id="delete-yes" class="neu-btn yes" type="button">Yes</button>
            </div>
        </div>

        <!-- NEW WORDLIST BUTTON -->
        <button id="new-wordlist-btn" class="neu-btn wordlist" type="button">New Wordlist</button>

        <!-- NEW WORDLIST MENU -->
        <div id="new-wordlist-menu" class="neu-card menu">
            <h2>New wordlist</h2>
            <h3 id="new-wordlist-language-display">Japanese</h3>
            <input id="new-wordlist-name-input" class="neu-input" type="text" placeholder="Name">
            <button id="new-wordlist-create" class="neu-btn create" type="button">Create</button>
            <button id="new-wordlist-language" class="neu-btn language" type="button">Language</button>
        </div>

        <div id="wordlists-container"></div>

        <div id="settings-menu" class="neu-card menu">
            <h2>Settings</h2>
            <div id="settings-fields"></div>
            <button id="settings-save" class="neu-btn" type="button">Save</button>
        </div>
        <button id="settings" class="neu-btn" type="button">Settings</button>
    </nav>

    <!--CONTENT DISPLAY-->
    <main class="neu-card" style="grid-area: box-3">
        <div class="word-container" id="search-result-container"></div>
        <div class="word-container" id="wordlist-words-container"></div>
    </main>

    <!--SCRIPTS-->
    <script src="js/notify.js"></script>
    <script src="js/wordlist.js"></script>
    <script src="js/settings.js"></script>
    <script src="renderer.js"></script>
</body>

</html>
